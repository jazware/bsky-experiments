# Explicit project name: packages/oracle/build/indexer would otherwise also
# default to "indexer" and `docker compose down` there would remove this one.
name: indexer
services:
  indexer:
    build:
      context: ../../../
      dockerfile: atproto/build/indexer/Dockerfile
      args:
        - GIT_COMMIT=${GIT_COMMIT:-unknown}
        - BUILD_TIME=${BUILD_TIME:-unknown}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    image: indexer
    container_name: atproto-indexer
    env_file:
      - ../../env/indexer.env
    ports:
      - "8091:8081"
