services:
  crawler:
    build:
      context: ../..
      dockerfile: build/crawler/Dockerfile
      args:
        - GIT_COMMIT=${GIT_COMMIT:-unknown}
        - BUILD_TIME=${BUILD_TIME:-unknown}
    network_mode: host
    restart: no
    image: crawler
    container_name: atproto-crawler
    env_file:
      - ../../env/crawler.env
    environment:
      - GOGC=200
      - GOMEMLIMIT=48GiB
    volumes:
      # CRAWLER_DATA_DIR: an absolute host path (`just crawler` reads it from env/crawler.env).
      - ${CRAWLER_DATA_DIR:-../../data/crawler}:/data/rca
